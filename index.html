<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OKPC Buddy Check-In</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --mentor-bg: #ede9fe;
      --mentor-text: #5b21b6;
      --mentee-bg: #dbeafe;
      --mentee-text: #1e40af;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 60px; }
    header {
      background: #1e293b; color: white; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }
    .btn-header {
      background: #334155; color: white; border: none; padding: 7px 12px;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .controls {
      background: white; padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      max-width: 760px; margin: 0 auto;
    }
    .controls select, .controls input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: #fff;
    }
    .search-row { grid-column: 1 / -1; }
    .role-tabs {
      display: flex; background: #f1f5f9; padding: 4px; border-radius: 8px;
      grid-column: 1 / -1;
    }
    .role-tab {
      flex: 1; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 600;
      border-radius: 6px; cursor: pointer; color: var(--muted);
    }
    .role-tab.active { background: white; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .stats-bar {
      padding: 10px 16px; font-size: 13px; color: var(--muted);
      max-width: 760px; margin: 0 auto;
    }
    .container { padding: 0 14px; max-width: 760px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .student-name { font-size: 17px; font-weight: 700; margin-right: 8px; }
    .meta-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .badge.Mentor { background: var(--mentor-bg); color: var(--mentor-text); }
    .badge.Mentee { background: var(--mentee-bg); color: var(--mentee-text); }
    .slots-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .slot-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: #f8fafc; cursor: pointer;
    }
    .slot-item.checked-in { background: #f0fdf4; border-color: #bbf7d0; cursor: default; }
    .slot-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .slot-left input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .slot-status { font-size: 12px; font-weight: 600; color: var(--success); }
    .btn-checkin {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-weight: 600; font-size: 14px;
      cursor: pointer;
    }
    .btn-checkin:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-checkin.all-done { background: var(--success); }
  </style>
</head>
<body>

  <header>
    <h1>OKPC Check-In</h1>
    <div class="header-btns">
      <button class="btn-header" onclick="resetPin()">🔑 PIN</button>
      <button class="btn-header" onclick="loadData()">↻ Sync</button>
    </div>
  </header>

  <div class="controls">
    <select id="dateFilter" onchange="renderCards()"></select>
    <select id="activityFilter" onchange="renderCards()"></select>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search signed-up participant..." oninput="renderCards()">
    </div>
    <div class="role-tabs">
      <div class="role-tab active" onclick="setRoleFilter('ALL', this)">All</div>
      <div class="role-tab" onclick="setRoleFilter('Mentor', this)">Mentors</div>
      <div class="role-tab" onclick="setRoleFilter('Mentee', this)">Mentees</div>
    </div>
  </div>

  <div class="stats-bar" id="summaryText">Initializing...</div>
  <div class="container" id="cardsContainer"></div>

  <script>
    // PASTE YOUR APPS SCRIPT /exec URL BELOW:
    const API_URL = "https://script.google.com/macros/s/AKfycbwEPjkiQ9otKQoSYEtlkWEdDLD8MTR6rXzBsTH6c7vOy8uSmtogIAC3-mBH3rDrPk_hJQ/exec";

    let appData = { activities: [], activeDates: [], participants: [] };
    let currentRoleFilter = 'ALL';

    window.onload = loadData;

    function resetPin() {
      localStorage.removeItem('okpc_checkin_pin');
      loadData();
    }

    function getPin(forcePrompt = false) {
      let pin = localStorage.getItem('okpc_checkin_pin');
      if (!pin || forcePrompt) {
        pin = prompt('Enter OKPC Check-In PIN:');
        if (pin !== null) {
          pin = pin.trim();
          localStorage.setItem('okpc_checkin_pin', pin);
        }
      }
      return pin || '';
    }

    async function loadData() {
      if (!API_URL || API_URL.includes("YOUR_APPS_SCRIPT")) {
        document.getElementById('summaryText').textContent = '⚠️ Error: Please replace API_URL in index.html with your Apps Script /exec URL.';
        return;
      }

      const pin = getPin(false);
      if (!pin) {
        document.getElementById('summaryText').textContent = 'PIN required. Tap 🔑 PIN or ↻ Sync to enter PIN.';
        return;
      }

      document.getElementById('summaryText').textContent = 'Syncing with Google Sheet...';
      try {
        const res = await fetch(`${API_URL}?pin=${encodeURIComponent(pin)}`, { method: 'GET', redirect: 'follow' });
        const rawText = await res.text();

        let data;
        try {
          data = JSON.parse(rawText);
        } catch (jsonErr) {
          document.getElementById('summaryText').textContent =
            '⚠️ Apps Script returned HTML instead of JSON. In Apps Script, go to Deploy -> Manage deployments -> Edit -> select "New version" -> Deploy.';
          console.error('Non-JSON response:', rawText.slice(0, 300));
          return;
        }

        if (data.authError) {
          localStorage.removeItem('okpc_checkin_pin');
          alert('Incorrect PIN. Please try again.');
          const retryPin = getPin(true);
          if (retryPin) return loadData();
          document.getElementById('summaryText').textContent = 'Locked. Tap 🔑 PIN to enter PIN.';
          return;
        }

        appData = {
          activities: Array.isArray(data.activities) ? data.activities : ['Reading'],
          activeDates: Array.isArray(data.activeDates) ? data.activeDates : [],
          participants: Array.isArray(data.participants) ? data.participants : []
        };
        populateFilters();
        renderCards();
      } catch (err) {
        document.getElementById('summaryText').textContent = 'Network/CORS error: ' + err.message;
        console.error(err);
      }
    }

    function populateFilters() {
      const dateSel = document.getElementById('dateFilter');
      const prevDate = dateSel.value;
      dateSel.innerHTML = '';

      // Match local date YYYY-MM-DD
      const now = new Date();
      const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      let defaultDate = appData.activeDates[0] || '';

      appData.activeDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        dateSel.appendChild(opt);
        if (d.startsWith(localIso)) defaultDate = d;
      });

      if (prevDate && appData.activeDates.includes(prevDate)) {
        dateSel.value = prevDate;
      } else if (defaultDate) {
        dateSel.value = defaultDate;
      }

      const actSel = document.getElementById('activityFilter');
      actSel.innerHTML = '<option value="ALL">All Activities</option>';
      appData.activities.forEach(a => {
        actSel.innerHTML += `<option value="${a}">${a}</option>`;
      });
    }

    function setRoleFilter(role, el) {
      currentRoleFilter = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const selectedDate = document.getElementById('dateFilter').value;
      const selectedAct = document.getElementById('activityFilter').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      const filtered = appData.participants.filter(p => {
        if (p.eventDate !== selectedDate) return false;
        if (selectedAct !== 'ALL' && p.activity !== selectedAct) return false;
        if (currentRoleFilter !== 'ALL' && p.role !== currentRoleFilter) return false;
        if (query && !p.studentName.toLowerCase().includes(query)) return false;
        return true;
      });

      let totalSlots = 0, checkedSlots = 0;
      filtered.forEach(p => p.slots.forEach(s => {
        totalSlots++;
        if (s.checkedIn) checkedSlots++;
      }));

      document.getElementById('summaryText').textContent =
        `${filtered.length} signed-up participants (${checkedSlots}/${totalSlots} session slots checked in)`;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px 16px;color:#64748b;">No signed-up participants found for this date/filter.</div>';
        return;
      }

      filtered.forEach((p, idx) => {
        const allChecked = p.slots.every(s => s.checkedIn);
        const card = document.createElement('div');
        card.className = 'card';

        const slotsHtml = p.slots.map((s, sIdx) => {
          const inputId = `chk_${idx}_${sIdx}`;
          if (s.checkedIn) {
            return `
              <div class="slot-item checked-in">
                <div class="slot-left">
                  <input type="checkbox" checked disabled>
                  <span>${s.timeSlot}</span>
                </div>
                <span class="slot-status">✓ Checked In</span>
              </div>`;
          }
          return `
            <label class="slot-item" for="${inputId}">
              <div class="slot-left">
                <input type="checkbox" id="${inputId}" data-pidx="${idx}" value="${s.timeSlot}" checked>
                <span>${s.timeSlot}</span>
              </div>
              <span style="font-size:12px;color:#64748b;">Signed Up</span>
            </label>`;
        }).join('');

        card.innerHTML = `
          <div>
            <span class="student-name">${p.studentName}</span>
            <span class="badge ${p.role}">${p.role}</span>
            <div class="meta-sub">Grade: ${p.grade || 'N/A'} • Activity: ${p.activity} ${p.parentPhone ? '• ' + p.parentPhone : ''}</div>
          </div>
          <div class="slots-list">${slotsHtml}</div>
          <button class="btn-checkin ${allChecked ? 'all-done' : ''}"
                  ${allChecked ? 'disabled' : ''}
                  onclick="submitCardCheckIn(${idx}, this)">
            ${allChecked ? '✓ All Signed-Up Slots Checked In' : 'Check In Selected Slot(s)'}
          </button>
        `;
        container.appendChild(card);
        card.querySelector('.btn-checkin').participantRef = p;
      });
    }

    async function submitCardCheckIn(cardIdx, btnEl) {
      const p = btnEl.participantRef;
      const checkboxes = document.querySelectorAll(`input[data-pidx="${cardIdx}"]:checked`);
      const selectedSlots = Array.from(checkboxes).map(cb => cb.value);

      if (selectedSlots.length === 0) {
        alert('Please select at least one signed-up time slot.');
        return;
      }

      btnEl.disabled = true;
      btnEl.textContent = 'Saving...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            pin: getPin(false),
            eventDate: p.eventDate,
            studentName: p.studentName,
            grade: p.grade,
            role: p.role,
            activity: p.activity,
            parentEmail: p.parentEmail,
            parentPhone: p.parentPhone,
            selectedSlots: selectedSlots
          })
        });
        const data = await res.json();
        if (data.authError) {
          localStorage.removeItem('okpc_checkin_pin');
          alert('Invalid PIN.');
          btnEl.disabled = false;
          btnEl.textContent = 'Check In Selected Slot(s)';
          return;
        }
        if (data.success) {
          p.slots.forEach(s => {
            if (selectedSlots.includes(s.timeSlot)) {
              s.checkedIn = true;
              s.timestamp = data.timestamp;
            }
          });
          renderCards();
        } else {
          alert('Error saving check-in: ' + (data.error || 'Unknown'));
          btnEl.disabled = false;
          btnEl.textContent = 'Check In Selected Slot(s)';
        }
      } catch (err) {
        alert('Network error while saving check-in.');
        btnEl.disabled = false;
        btnEl.textContent = 'Check In Selected Slot(s)';
      }
    }
  </script>
</body>
</html>
